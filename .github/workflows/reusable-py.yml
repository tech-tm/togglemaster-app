name: Python package

on: 
  workflow_call:
    inputs:
        service-path:
          description: 'Path to the service directory'
          required: true
          type: string
        service-name:
          description: 'Name of the service'
          required: true
          type: string
        python-version:
          description: 'Python version to use'
          type: string
          default: '3.9'
        os:
          description: 'Operating system to run the workflow on'
          type: string
          default: 'ubuntu-latest'

jobs:

  build:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache-dependency-path: '${{ inputs.service-path }}/requirements.txt'

      - name: Install dependencies
        working-directory: ${{ inputs.service-path }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest

  lint-analysis:
    name: Lint Analysis
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: Run flake8
        working-directory: ${{ inputs.service-path }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
  security-scan:
    name: Security Scan (SAST & SCA)
    needs: [build, lint-analysis]
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Bandit for SAST
        run: pip install bandit

      - name: Run Bandit Security Scanner
        working-directory: ${{ inputs.service-path }}
        run: bandit -r . -lll -ii -x ./tests

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.service-path }}'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true