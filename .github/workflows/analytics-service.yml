name: Analytics Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/analytics-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/analytics-service/**'
  # Permite disparar manualmente via Actions UI ou 'gh workflow run'.
  # Util quando precisamos forcar build/push sem alterar arquivos do
  # servico (ex: Fase 2 do DEPLOY.md apos recriar o ECR do zero).
  workflow_dispatch:

jobs:
  call-py:
    uses: ./.github/workflows/reusable-py.yml
    with:
      service-path: 'src/analytics-service'
      service-name: 'analytics-service'
      os: 'ubuntu-latest'
      python-version: '3.12'
    secrets: inherit

  call-docker:
    needs: call-py
    uses: ./.github/workflows/reusable-docker.yml
    with:
      service-path: 'src/analytics-service'
      image-name: 'analytics-service'
    secrets: inherit
  