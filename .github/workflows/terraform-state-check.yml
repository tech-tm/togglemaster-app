name: Terraform State Check

# ----------------------------------------------------------------------
# Verifica se o state do Terraform (no bucket S3 'tech4-tfstates' ou
# equivalente) esta sincronizado com a AWS real, em todas as 5 camadas:
# security, data, platform, compute, networking.
#
# Nao aplica mudancas — so detecta drift e relata. Util como preflight
# antes de rodar o 'Terraform Apply', especialmente apos uma sessao
# AWS Academy que destruiu recursos.
#
# Saida: tabela no $GITHUB_STEP_SUMMARY mostrando qual camada tem drift.
# Pra consertar: rodar o 'Terraform Apply' (ele faz refresh automatico
# nos passos de reconciliacao agora).
# ----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      auto_reconcile:
        description: 'Aplicar refresh automatico se detectar drift (padrao: nao, so reporta)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:
  check:
    name: Check State vs AWS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer:
          - security
          - data
          - platform
          - compute
          - networking
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/${{ matrix.layer }}
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/${{ matrix.layer }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Check for state drift
        id: drift
        working-directory: terraform/environments/prod/${{ matrix.layer }}
        shell: bash
        continue-on-error: true
        run: |
          # Networking usa --var em vez de --var-file (pattern do apply)
          if [ "${{ matrix.layer }}" = "networking" ]; then
            VAR_ARG="-var=terraform_state_bucket=$BUCKET_STATE"
          else
            VAR_ARG="-var-file=terraform.tfvars"
          fi

          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            $VAR_ARG \
            -out=refresh.tfplan 2>&1 | tee /tmp/plan-${{ matrix.layer }}.log
          REFRESH_EXIT=$?
          set -e

          echo "exit_code=$REFRESH_EXIT" >> $GITHUB_OUTPUT

          # Detecta cenarios de "ambiente destruido" (cross-stack dependency
          # ou SSM parameter inexistente) e reporta como DESTROYED em vez de ERROR.
          if [ $REFRESH_EXIT -ne 0 ] && [ $REFRESH_EXIT -ne 2 ]; then
            if grep -qE "Unsupported attribute|data.terraform_remote_state.*outputs is object with no attributes|couldn't find resource|No value found|data source \".*\" is not supported" /tmp/plan-${{ matrix.layer }}.log; then
              echo "⊘ ${{ matrix.layer }}: ambiente parcial/destruido (dependencia cross-stack ou SSM inexistente)"
              echo "    Isso e NORMAL apos 'terraform destroy'. Rode 'Terraform Apply' para recriar."
              echo "status=DESTROYED" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          case $REFRESH_EXIT in
            0)
              echo "✓ ${{ matrix.layer }}: sem drift"
              echo "status=OK" >> $GITHUB_OUTPUT
              ;;
            2)
              echo "⚠ ${{ matrix.layer }}: DRIFT DETECTADO"
              echo "status=DRIFT" >> $GITHUB_OUTPUT
              # Lista recursos que estao no state mas nao existem na AWS
              echo "--- Recursos com drift ---"
              grep -E "^\s*[-#]\s" /tmp/plan-${{ matrix.layer }}.log | head -30 || true
              ;;
            *)
              echo "✗ ${{ matrix.layer }}: erro ao executar plan (exit=$REFRESH_EXIT)"
              echo "status=ERROR" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: Reconcile (optional, if auto_reconcile=true)
        if: steps.drift.outputs.status == 'DRIFT' && inputs.auto_reconcile == true
        working-directory: terraform/environments/prod/${{ matrix.layer }}
        run: |
          echo "Aplicando refresh-only para sincronizar o state..."
          terraform apply -auto-approve refresh.tfplan

      - name: Report to summary
        if: always()
        run: |
          STATUS="${{ steps.drift.outputs.status }}"
          case $STATUS in
            OK)        EMOJI="✅" ; MSG="State sincronizado com a AWS" ;;
            DRIFT)     EMOJI="⚠️"  ; MSG="Drift detectado — rode Terraform Apply ou re-rode com auto_reconcile=true" ;;
            DESTROYED) EMOJI="⊘"  ; MSG="Ambiente destruido — normal apos terraform destroy. Rode Terraform Apply para recriar." ;;
            ERROR)     EMOJI="❌" ; MSG="Erro ao verificar — ver logs do step" ;;
            *)         EMOJI="❓" ; MSG="Status desconhecido" ;;
          esac

          # Primeiro job desse matrix inicializa a tabela
          if [ ! -f "$GITHUB_STEP_SUMMARY.header" ]; then
            cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Terraform State Check

          | Camada | Status | Mensagem |
          |---|---|---|
          EOF
            touch "$GITHUB_STEP_SUMMARY.header"
          fi

          echo "| ${{ matrix.layer }} | $EMOJI $STATUS | $MSG |" >> $GITHUB_STEP_SUMMARY
